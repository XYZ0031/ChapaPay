<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChapaPay — Log in</title>
<style>
  :root{
    --green:#0a6b3b;
    --green-dark:#064d2a;
    --green-light:#12a45c;
    --ink:#0d1b12;
    --paper:#ffffff;
    --mist:#eef4ef;
    --line:#c7d6cc;
    --danger:#b3261e;
    --ok:#0a6b3b;
    --focus:#12a45c;
    --radius:16px;
    --tap:56px;
    --fs-base:18px;
    --fs-lg:22px;
    --fs-xl:30px;
    --fs-xxl:40px;
    --pad:20px;
  }
  /* SUN MODE: high-contrast, sunlight-legible */
  body.sun{
    --green:#003d20;
    --green-dark:#002313;
    --ink:#000000;
    --paper:#ffffff;
    --mist:#ffffff;
    --line:#000000;
    --danger:#8a0000;
    --focus:#000000;
    --fs-base:21px;
    --fs-lg:26px;
    --fs-xl:34px;
    --fs-xxl:46px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
    background:var(--mist);
    color:var(--ink);
    font-size:var(--fs-base);
    line-height:1.4;
    display:flex;
    justify-content:center;
    -webkit-font-smoothing:antialiased;
  }
  .phone{
    width:100%;
    max-width:430px;
    min-height:100vh;
    background:var(--paper);
    display:flex;
    flex-direction:column;
    position:relative;
  }
  /* top utility bar: language + sun mode. Big, obvious, before login. */
  .utility{
    display:flex;
    gap:10px;
    padding:14px var(--pad);
    background:var(--green);
    align-items:center;
  }
  .brand{
    display:flex;align-items:center;gap:10px;
    color:#fff;font-weight:800;font-size:var(--fs-lg);
    margin-right:auto;letter-spacing:.3px;
  }
  .brand .mark{
    width:34px;height:34px;border-radius:9px;background:#fff;
    display:grid;place-items:center;color:var(--green);font-weight:900;
    font-size:20px;
  }
  .util-btn{
    min-height:44px;padding:8px 14px;border-radius:10px;border:2px solid #fff;
    background:transparent;color:#fff;font-weight:700;font-size:16px;cursor:pointer;
    display:flex;align-items:center;gap:6px;
  }
  .util-btn.on{background:#fff;color:var(--green)}
  .util-btn:focus-visible{outline:4px solid #ffd34d;outline-offset:2px}

  .body{padding:26px var(--pad) 30px;flex:1;display:flex;flex-direction:column}
  h1{font-size:var(--fs-xl);line-height:1.15;margin-bottom:6px}
  .sub{font-size:var(--fs-base);color:#3a4a40;margin-bottom:24px}
  body.sun .sub{color:#000}

  label{display:block;font-weight:700;font-size:var(--fs-base);margin-bottom:8px}
  .hint{font-weight:400;color:#3a4a40;font-size:15px}
  body.sun .hint{color:#000}

  .field{margin-bottom:20px}
  .phone-input{display:flex;align-items:stretch;border:2px solid var(--line);border-radius:var(--radius);overflow:hidden;background:#fff}
  .cc{display:flex;align-items:center;gap:8px;padding:0 14px;background:var(--mist);border-right:2px solid var(--line);font-weight:800;font-size:var(--fs-lg)}
  body.sun .cc{background:#f0f0f0}
  .flag{font-size:24px}
  input[type=tel]{
    flex:1;border:0;outline:0;padding:0 16px;font-size:var(--fs-xl);
    min-height:var(--tap);letter-spacing:2px;background:#fff;color:var(--ink);
    min-width:0;
  }
  .phone-input:focus-within{outline:4px solid var(--focus);outline-offset:1px;border-radius:var(--radius)}

  /* PIN dots + on-screen keypad = no tiny keyboard, no literacy barrier */
  .pin-dots{display:flex;gap:16px;justify-content:center;margin:10px 0 22px}
  .dot{width:22px;height:22px;border-radius:50%;border:3px solid var(--green);background:transparent}
  .dot.filled{background:var(--green)}
  body.sun .dot{border-color:#000}
  body.sun .dot.filled{background:#000}

  .keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .key{
    min-height:var(--tap);border:2px solid var(--line);border-radius:var(--radius);
    background:#fff;font-size:var(--fs-xxl);font-weight:700;color:var(--ink);cursor:pointer;
    display:grid;place-items:center;user-select:none;
  }
  .key:active{background:var(--mist)}
  .key.action{font-size:var(--fs-lg);font-weight:700}
  .key:focus-visible{outline:4px solid var(--focus);outline-offset:2px}
  .key.blank{border:0;background:transparent;cursor:default}

  .row-between{display:flex;justify-content:space-between;align-items:center;margin:8px 0 20px}
  .toggle-see{
    display:flex;align-items:center;gap:8px;background:transparent;border:0;
    color:var(--green);font-weight:700;font-size:16px;cursor:pointer;min-height:44px;padding:0 4px;
  }
  body.sun .toggle-see{color:#000;text-decoration:underline}
  .link{color:var(--green);font-weight:700;font-size:16px;text-decoration:underline;background:0;border:0;cursor:pointer;min-height:44px}
  body.sun .link{color:#000}

  .cta{
    width:100%;min-height:var(--tap);border:0;border-radius:var(--radius);
    background:var(--green);color:#fff;font-size:var(--fs-lg);font-weight:800;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:10px;margin-top:8px;
  }
  .cta:active{background:var(--green-dark)}
  .cta:focus-visible{outline:4px solid #ffd34d;outline-offset:3px}
  .cta[disabled]{opacity:.45;cursor:not-allowed}

  .bio{
    width:100%;min-height:var(--tap);margin-top:14px;border:2px solid var(--green);
    background:#fff;color:var(--green);border-radius:var(--radius);font-size:var(--fs-base);
    font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;
  }
  body.sun .bio{border-color:#000;color:#000}

  /* forgiving, specific error message */
  .alert{display:none;align-items:flex-start;gap:12px;background:#fdecea;border:2px solid var(--danger);
    color:var(--danger);border-radius:var(--radius);padding:14px 16px;margin-bottom:18px;font-size:16px;font-weight:600}
  .alert.show{display:flex}
  body.sun .alert{background:#fff}

  .status-net{display:flex;align-items:center;gap:8px;font-size:14px;color:#3a4a40;margin-top:auto;padding-top:24px}
  body.sun .status-net{color:#000}
  .net-dot{width:10px;height:10px;border-radius:50%;background:#e0a800}

  .footer-help{text-align:center;padding:14px;background:var(--mist);border-top:2px solid var(--line);
    font-size:16px;font-weight:700;color:var(--green)}
  body.sun .footer-help{color:#000;background:#fff}

  .success{position:absolute;inset:0;background:var(--green);color:#fff;display:none;
    flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:30px}
  .success.show{display:flex}
  .success .tick{width:90px;height:90px;border-radius:50%;background:#fff;color:var(--green);
    display:grid;place-items:center;font-size:54px;font-weight:900}
  .success h2{font-size:var(--fs-xl)}

  @media (prefers-reduced-motion: no-preference){
    .cta,.key,.util-btn{transition:background .12s ease}
  }
</style>
</head>
<body>
<div class="phone" id="app">

  <div class="utility">
    <div class="brand"><span class="mark">C</span><span id="brandName">ChapaPay</span></div>
    <button class="util-btn on" id="langBtn" aria-pressed="true">EN / SW</button>
    <button class="util-btn" id="sunBtn" aria-pressed="false">☀ <span id="sunLbl">Sun</span></button>
  </div>

  <div class="body">
    <h1 id="title">Karibu — log in</h1>
    <p class="sub" id="subtitle">Enter your phone number and 4-digit PIN.</p>

    <div class="alert" id="alert" role="alert">
      <span>⚠</span>
      <span id="alertText">That PIN didn't match. Check the number and try again — you have 4 tries left.</span>
    </div>

    <div class="field">
      <label for="phone" id="phoneLabel">Phone number <span class="hint" id="phoneHint">(the one you registered)</span></label>
      <div class="phone-input">
        <span class="cc"><span class="flag">🇰🇪</span>+254</span>
        <input id="phone" type="tel" inputmode="numeric" placeholder="7•• ••• •••" maxlength="9" aria-describedby="phoneHint">
      </div>
    </div>

    <div class="field">
      <label id="pinLabel">Your PIN</label>
      <div class="pin-dots" id="pinDots" aria-label="PIN entry" role="status">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
      </div>

      <div class="row-between">
        <button class="toggle-see" id="seeBtn" aria-pressed="false">👁 <span id="seeLbl">Show PIN</span></button>
        <button class="link" id="forgotBtn">Forgot PIN?</button>
      </div>

      <div class="keypad" id="keypad">
        <button class="key" data-k="1">1</button>
        <button class="key" data-k="2">2</button>
        <button class="key" data-k="3">3</button>
        <button class="key" data-k="4">4</button>
        <button class="key" data-k="5">5</button>
        <button class="key" data-k="6">6</button>
        <button class="key" data-k="7">7</button>
        <button class="key" data-k="8">8</button>
        <button class="key" data-k="9">9</button>
        <button class="key blank" disabled></button>
        <button class="key" data-k="0">0</button>
        <button class="key action" data-k="del" aria-label="Delete">⌫</button>
      </div>
    </div>

    <button class="cta" id="loginBtn" disabled><span id="loginLbl">Log in</span> →</button>
    <button class="bio" id="bioBtn">👆 <span id="bioLbl">Use fingerprint instead</span></button>

    <div class="status-net">
      <span class="net-dot"></span><span id="netText">Weak network — we'll keep trying to send your code.</span>
    </div>
  </div>

  <div class="footer-help" id="helpBtn">📞 Need help? Call 0709 000 000 (free)</div>

  <div class="success" id="success" role="alert">
    <div class="tick">✓</div>
    <h2 id="successText">You're in. Karibu!</h2>
  </div>
</div>

<script>
(function(){
  var pin = "";
  var showPin = false;
  var sw = false;
  var attempts = 4;

  var dots = document.querySelectorAll('#pinDots .dot');
  var loginBtn = document.getElementById('loginBtn');
  var alertBox = document.getElementById('alert');

  var T = {
    en:{title:"Karibu  Log In", subtitle:"Enter your phone number and 4-digit PIN.",
        phoneLabel:"Phone number", phoneHint:"(the one you registered)", pinLabel:"Your PIN",
        see:"Show PIN", hide:"Hide PIN", forgot:"Forgot PIN?", login:"Log in",
        bio:"Use fingerprint instead", net:"Weak network  we'll keep trying to send your code.",
        help:"📞 Need help? Call 0709 000 000 (free)", sun:"Sun", success:"You're in. Karibu!"},
    sw:{title:"Karibu  Ingia", subtitle:"Weka nambari yako ya simu na PIN ya nambari 4.",
        phoneLabel:"Nambari ya simu", phoneHint:"(uliyosajili)", pinLabel:"PIN yako",
        see:"Onyesha PIN", hide:"Ficha PIN", forgot:"Umesahau PIN?", login:"Ingia",
        bio:"Tumia alama ya kidole", net:"Mtandao dhaifu  tutaendelea kutuma nambari yako.",
        help:"📞 Unahitaji msaada? Piga 0709 000 000 (bure)", sun:"Jua", success:"Umeingia. Karibu!"}
  };

  function renderDots(){
    dots.forEach(function(d,i){
      d.classList.toggle('filled', i < pin.length);
      d.textContent = (showPin && pin[i]) ? pin[i] : "";
      d.style.fontSize = "16px"; d.style.color="#fff"; d.style.textAlign="center";
      if(showPin && pin[i]){d.style.lineHeight="16px";}
    });
    loginBtn.disabled = !(pin.length === 4 && document.getElementById('phone').value.length >= 9);
  }

  document.getElementById('keypad').addEventListener('click', function(e){
    var b = e.target.closest('.key'); if(!b) return;
    var k = b.getAttribute('data-k'); if(!k) return;
    alertBox.classList.remove('show');
    if(k === 'del'){ pin = pin.slice(0,-1); }
    else if(pin.length < 4){ pin += k; }
    renderDots();
  });

  document.getElementById('phone').addEventListener('input', renderDots);

  document.getElementById('seeBtn').addEventListener('click', function(){
    showPin = !showPin; this.setAttribute('aria-pressed', showPin);
    document.getElementById('seeLbl').textContent = showPin ? L().hide : L().see;
    renderDots();
  });

  function L(){ return sw ? T.sw : T.en; }
  function applyLang(){
    var t = L();
    document.getElementById('title').textContent = t.title;
    document.getElementById('subtitle').textContent = t.subtitle;
    document.getElementById('phoneLabel').firstChild.textContent = t.phoneLabel + " ";
    document.getElementById('phoneHint').textContent = t.phoneHint;
    document.getElementById('pinLabel').textContent = t.pinLabel;
    document.getElementById('seeLbl').textContent = showPin ? t.hide : t.see;
    document.getElementById('forgotBtn').textContent = t.forgot;
    document.getElementById('loginLbl').textContent = t.login;
    document.getElementById('bioLbl').textContent = t.bio;
    document.getElementById('netText').textContent = t.net;
    document.getElementById('helpBtn').textContent = t.help;
    document.getElementById('sunLbl').textContent = t.sun;
    document.getElementById('successText').textContent = t.success;
  }
  document.getElementById('langBtn').addEventListener('click', function(){
    sw = !sw; this.textContent = sw ? "SW / EN" : "EN / SW"; applyLang();
  });

  document.getElementById('sunBtn').addEventListener('click', function(){
    var on = document.body.classList.toggle('sun');
    this.classList.toggle('on', on); this.setAttribute('aria-pressed', on);
  });

  document.getElementById('loginBtn').addEventListener('click', function(){
    if(pin === "1234"){ document.getElementById('success').classList.add('show'); return; }
    attempts--;
    var msg = sw
      ? "PIN hailingani. Angalia nambari na ujaribu tena — umebakiza majaribio " + attempts + "."
      : "That PIN didn't match. Check the number and try again — you have " + attempts + " tries left.";
    document.getElementById('alertText').textContent = msg;
    alertBox.classList.add('show');
    pin = ""; renderDots();
    document.getElementById('alert').scrollIntoView({behavior:'smooth', block:'center'});
  });

  document.getElementById('bioBtn').addEventListener('click', function(){
    document.getElementById('success').classList.add('show');
  });
  document.getElementById('forgotBtn').addEventListener('click', function(){
    alert(sw ? "Tutakutumia nambari ya siri kwa SMS kuweka PIN mpya." :
               "We'll send you a code by SMS to set a new PIN.");
  });
  document.getElementById('helpBtn').addEventListener('click', function(){
    alert(sw ? "Piga 0709 000 000 — bure." : "Call 0709 000 000 — free.");
  });

  // demo hint
  renderDots();
})();
</script>
</body>
</html>
